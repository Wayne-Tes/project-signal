<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--app-bg); font-family: var(--font-body); padding: 26px; color: var(--text-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Select } = window.LighthouseDesignSystem_68eba0;
  function Demo() {
    return (
      <div className="grid">
        <Input label="Campaign name" placeholder="Autumn renewal nudge" defaultValue="Autumn renewal nudge" />
        <Select label="Audience" options={['All accounts','At-risk only','Multi-academy trusts']} />
        <Input label="Subject reference" defaultValue="acc_0000" error="This account does not exist." />
        <Select label="Trigger" options={['On a schedule','Health score below 50','Headteacher change']} />
        <div style={{gridColumn:'1 / -1'}}>
          <Input label="Template prompt" as="textarea" hint="The draft is reviewed by a human before every send."
            defaultValue="Draft a warm check-in for accounts whose Class Charts logins dropped this term." />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
