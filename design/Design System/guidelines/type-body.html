<!-- @dsCard group="Type" viewport="700x200" name="Body, lead & labels" subtitle="Open Sans body, lead, muted & uppercase eyebrow" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); padding: 24px; }
  .line { padding: 7px 0; border-bottom: 1px solid var(--tes-n-100); display: flex; align-items: baseline; gap: 16px; }
  .tok { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="line"><span style="font-size:17px;color:var(--text-body)">Lead — here's what's moving across your portfolio.</span><span class="tok">--fs-lead · 17</span></div>
  <div class="line"><span style="font-size:14px;color:var(--text-body)">Body — 14px Open Sans, line-height 1.5. The default text size for the product.</span><span class="tok">--fs-body · 14</span></div>
  <div class="line"><span style="font-size:13px;color:var(--text-muted)">Muted secondary — sorted by health-score movement.</span><span class="tok">--fs-sm · 13</span></div>
  <div class="line"><span class="eyebrow">Critical accounts</span><span class="tok">--fs-xs · 11.5 · 700</span></div>
</body>
</html>
