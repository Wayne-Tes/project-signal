<!-- @dsCard group="Type" viewport="700x190" name="Metric figures & mono" subtitle="Poppins 800 stat figures + monospace for IDs / keys" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); padding: 24px; color: var(--tes-ink); }
  .row { display: flex; align-items: flex-end; gap: 40px; }
  .stat { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; line-height: .9; }
  .tok { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); margin-top: 8px; }
  .col { display: flex; flex-direction: column; }
  .mono { font-family: var(--font-mono); font-size: 13px; color: var(--text-body); background: var(--tes-n-50); border: 1px solid var(--tes-n-200); border-radius: var(--radius-sm); padding: 6px 10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><span class="stat" style="font-size:64px">96<span style="font-size:34px;color:var(--tes-n-400)">%</span></span><span class="tok">--fs-stat-lg · 64</span></div>
    <div class="col"><span class="stat" style="font-size:42px">16<span style="font-size:24px;color:var(--tes-n-400)">/30</span></span><span class="tok">--fs-stat · 42</span></div>
    <div class="col" style="gap:8px"><span class="mono">URN&nbsp;900019</span><span class="tok">--font-mono · IDs / keys</span></div>
  </div>
</body>
</html>
