<!-- @dsCard group="Spacing" viewport="700x160" name="Radius" subtitle="sm 6 · md 10 · lg 14 · xl 18 · pill" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; gap: 18px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tile { width: 78px; height: 64px; background: var(--tes-blue-100); border: 1.5px solid var(--tes-blue); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="tile" style="border-radius:var(--radius-sm)"></div><span class="tok">sm · 6</span></div>
    <div class="col"><div class="tile" style="border-radius:var(--radius-md)"></div><span class="tok">md · 10</span></div>
    <div class="col"><div class="tile" style="border-radius:var(--radius-lg)"></div><span class="tok">lg · 14</span></div>
    <div class="col"><div class="tile" style="border-radius:var(--radius-xl)"></div><span class="tok">xl · 18</span></div>
    <div class="col"><div class="tile" style="border-radius:var(--radius-pill)"></div><span class="tok">pill</span></div>
  </div>
</body>
</html>
