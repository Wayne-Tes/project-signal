<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="n-50 → n-900 — wash, fills, borders, text" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--tes-n-200); }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .t { font-family: var(--font-mono); font-size: 10px; }
  .labels { display: flex; gap: 0; margin-top: 8px; }
  .labels span { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--tes-n-50)"></div>
    <div class="sw" style="background:var(--tes-n-100)"></div>
    <div class="sw" style="background:var(--tes-n-200)"></div>
    <div class="sw" style="background:var(--tes-n-300)"></div>
    <div class="sw" style="background:var(--tes-n-400)"></div>
    <div class="sw" style="background:var(--tes-n-500)"></div>
    <div class="sw" style="background:var(--tes-n-600)"></div>
    <div class="sw" style="background:var(--tes-n-700)"></div>
    <div class="sw" style="background:var(--tes-n-900)"></div>
  </div>
  <div class="labels">
    <span>50</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span><span>900</span>
  </div>
</body>
</html>
