<!-- @dsCard group="Colors" viewport="700x150" name="Brand mosaic" subtitle="The 8 categorical hues — chips, accents, avatars (never status)" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { width: 72px; height: 56px; border-radius: var(--radius-md); }
  .name { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-body); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--tes-mosaic-purple)"></div><span class="name">purple</span><span class="hex">#6B4E9E</span></div>
    <div class="sw"><div class="chip" style="background:var(--tes-mosaic-indigo)"></div><span class="name">indigo</span><span class="hex">#3E4A9E</span></div>
    <div class="sw"><div class="chip" style="background:var(--tes-mosaic-blue)"></div><span class="name">blue</span><span class="hex">#2B7DC4</span></div>
    <div class="sw"><div class="chip" style="background:var(--tes-mosaic-teal)"></div><span class="name">teal</span><span class="hex">#3FB6A8</span></div>
    <div class="sw"><div class="chip" style="background:var(--tes-mosaic-green)"></div><span class="name">green</span><span class="hex">#5FB573</span></div>
    <div class="sw"><div class="chip" style="background:var(--tes-mosaic-orange)"></div><span class="name">orange</span><span class="hex">#E8843C</span></div>
    <div class="sw"><div class="chip" style="background:var(--tes-mosaic-magenta)"></div><span class="name">magenta</span><span class="hex">#C9275E</span></div>
    <div class="sw"><div class="chip" style="background:var(--tes-mosaic-yellow)"></div><span class="name">yellow</span><span class="hex">#F2C13D</span></div>
  </div>
</body>
</html>
