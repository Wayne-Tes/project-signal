<!-- @dsCard group="Type" viewport="700x230" name="Display scale" subtitle="Poppins extra-bold — hero, section, page & panel titles" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); padding: 24px; color: var(--tes-ink); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--tes-n-100); }
  .d { font-family: var(--font-display); letter-spacing: -.02em; line-height: 1.05; }
  .tok { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
  <div class="line"><span class="d" style="font-size:52px;font-weight:800">Good evening</span><span class="tok">--fs-hero · 52 · 800</span></div>
  <div class="line"><span class="d" style="font-size:26px;font-weight:800">Your dashboard</span><span class="tok">--fs-h1 · 26 · 800</span></div>
  <div class="line"><span class="d" style="font-size:20px;font-weight:700">Health</span><span class="tok">--fs-h2 · 20 · 700</span></div>
  <div class="line"><span class="d" style="font-size:16px;font-weight:700">Band distribution</span><span class="tok">--fs-h3 · 16 · 700</span></div>
</body>
</html>
