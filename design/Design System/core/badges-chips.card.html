<!-- @dsCard group="Components" viewport="700x210" name="Badges & chips" subtitle="Status pills, category chips, filter-chip toggle row" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--app-bg); font-family: var(--font-body); padding: 26px; color: var(--text-body); }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); width: 72px; flex: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
  const { Badge, Chip } = window.LighthouseDesignSystem_68eba0;
  function Demo() {
    const [prio, setPrio] = React.useState('all');
    return (
      <div className="stack">
        <div className="row"><span className="lbl">Status</span>
          <Badge tone="positive">Active</Badge>
          <Badge tone="info">Open</Badge>
          <Badge tone="warn">review</Badge>
          <Badge tone="critical">high</Badge>
          <Badge tone="neutral">standard</Badge>
          <Badge tone="teal">synced</Badge>
        </div>
        <div className="row"><span className="lbl">Category</span>
          <Badge mosaic="#6B4E9E">head-change</Badge>
          <Badge mosaic="#E8843C">contact-bounce</Badge>
          <Badge mosaic="#9FCB3B">enrolment</Badge>
          <Badge mosaic="#2B7DC4">job-listing</Badge>
        </div>
        <div className="row"><span className="lbl">Filter</span>
          {['all','low','medium','high'].map(p => (
            <Chip key={p} active={prio===p} onClick={() => setPrio(p)}>{p}</Chip>
          ))}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
