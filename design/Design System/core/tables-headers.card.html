<!-- @dsCard group="Components" viewport="700x300" name="Page header & data table" subtitle="PageHeader + admin DataTable with badge cells" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--app-bg); font-family: var(--font-body); padding: 26px; color: var(--text-body); }
  .stack { display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
  const { PageHeader, DataTable, Badge, Button, Card } = window.LighthouseDesignSystem_68eba0;
  const rows = [
    { id: 1, upn: 'a.shah@tes.com', name: 'Aisha Shah', role: 'Admin', admin: true, status: 'Active' },
    { id: 2, upn: 'r.cole@tes.com', name: 'Rob Cole', role: 'CSM', admin: false, status: 'Active' },
    { id: 3, upn: 'm.diaz@tes.com', name: 'Marie Diaz', role: 'CSM', admin: false, status: 'Active' },
  ];
  function Demo() {
    return (
      <div className="stack">
        <PageHeader title="Users" subtitle="All staff users — JIT-provisioned and pre-created."
          action={<Button>Pre-create user</Button>} />
        <Card padding="0" style={{ padding: '6px 10px' }}>
          <DataTable
            columns={[
              { key: 'upn', header: 'UPN', mono: true },
              { key: 'name', header: 'Name' },
              { header: 'Role', render: r => <Badge tone={r.admin ? 'info' : 'neutral'}>{r.role}</Badge> },
              { header: 'Status', render: r => <Badge tone="positive">{r.status}</Badge> },
            ]}
            rows={rows}
          />
        </Card>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
