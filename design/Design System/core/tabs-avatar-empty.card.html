<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--app-bg); font-family: var(--font-body); padding: 26px; color: var(--text-body); }
  .grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 22px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
  const { Tabs, Avatar, EmptyState, Button } = window.LighthouseDesignSystem_68eba0;
  const Cal = () => (<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M4 6h16v15H4z"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>);
  function Demo() {
    const [tab, setTab] = React.useState('overview');
    return (
      <div className="grid">
        <div className="stack">
          <Tabs tabs={[{id:'overview',label:'Overview'},{id:'analytics',label:'Analytics'}]} value={tab} onChange={setTab} />
          <div className="row">
            <Avatar name="dev-admin" />
            <Avatar initial="R" gradient="linear-gradient(135deg,#C9275E,#E8843C)" />
            <Avatar name="Greenfield MAT" gradient="linear-gradient(135deg,#3FB6A8,#5FB573)" />
            <Avatar initial="S" gradient="linear-gradient(135deg,#6B4E9E,#2B7DC4)" size={46} />
          </div>
        </div>
        <div style={{background:'#fff',border:'1px solid var(--border-hairline)',borderRadius:'var(--radius-lg)'}}>
          <EmptyState icon={<Cal/>} title="No meetings in your scope"
            description="Calendar meetings linked to your accounts appear here once synced."
            action={<Button>Connect calendar</Button>} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
