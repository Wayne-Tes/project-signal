<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--app-bg); font-family: var(--font-body); padding: 28px 24px; }
  input::placeholder { color: var(--tes-n-400); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../_ds_bundle.js"></script>
<script type="text/babel">
  const { Composer } = window.LighthouseDesignSystem_68eba0;
  const answer = (q) => 'Across your portfolio: 16 of 30 accounts are healthy, 9 are on watch and 5 are critical. The biggest mover this week is Riverside High (down 12).';
  function Demo() {
    return React.createElement(Composer, {
      answer,
      suggestions: [
        { label: 'What is this platform?', icon: 'triage' },
        { label: 'Show at-risk accounts', icon: 'triage' },
        { label: 'How do I create a playbook?', icon: 'playbooks' },
      ],
    });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
