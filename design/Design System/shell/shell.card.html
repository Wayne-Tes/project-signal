<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="../styles.css">
<style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="../_ds_bundle.js"></script>

  const { AppShell, PageHeader, KpiCard, Button, Icon } = window.LighthouseDesignSystem_68eba0;
  function Demo() {

    return (
      <AppShell active={route} onNav={setRoute}>
        <div style={{ maxWidth: 1240, width: '100%', margin: '0 auto', padding: '40px 36px 72px' }}>

            <KpiCard label="Adoption" value="7,173" unit="req / week" accent="#3FB6A8" trend={{dir:'up',value:'12%',tone:'teal'}} spark={[0.15,0.28,0.26,0.48,0.42,0.7,0.92]} />

        </div>

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
