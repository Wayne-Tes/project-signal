# Explicit project name so container/volume/network names don't depend on the directory
# the repo happens to be cloned into.
name: project-signal

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: project_signal
      POSTGRES_USER: project_signal_app
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U project_signal_app -d project_signal']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # Stands in for S3 and SQS locally. This replaces the Pub/Sub emulator, and is a straight
    # upgrade on what it replaces: there was never a GCS emulator, so the raw-payload write and
    # read path could only ever be exercised against mocks. It can now be run for real.
    image: localstack/localstack:3
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3,sqs
      DEBUG: '0'
      # Credentials are irrelevant to LocalStack but the SDKs refuse to sign without them.
      AWS_DEFAULT_REGION: eu-west-2
    volumes:
      # Creates the bucket and queues on first boot so the stack is usable immediately.
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
