name: Terraform Plan

# Runs on PRs that touch infrastructure files, posts the staging plan as a comment.
on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'infra/stack/**'
      - 'infra/modules/**'
      - 'infra/envs/staging.tfvars'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan-staging:
    name: Plan — Staging
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra/stack

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.9'

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=env/staging"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=../envs/staging.tfvars \
            -var="image_tag=staging-$(git rev-parse --short HEAD)" \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('infra/stack/plan.txt', 'utf8');
            const plan = raw.length > 60000
              ? raw.slice(0, 60000) + '\n\n...(output truncated — see full logs)'
              : raw;

            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ Plan succeeded' : '❌ Plan failed';
            const body = [
              `## Terraform Plan — Staging  ${status}`,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${context.actor} on \`${context.ref}\`*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Terraform Plan — Staging')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if plan failed
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1
