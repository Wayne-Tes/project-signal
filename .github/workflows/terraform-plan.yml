name: Terraform Check — infra-aws

# Static validation of the AWS Terraform tree on every PR that touches it.
#
# WHY THIS EXISTS: until this workflow, `infra-aws/**` had NO CI coverage at all. The previous
# version of this file filtered on `infra/stack/**` and `infra/modules/**` — the superseded GCP
# tree that will never be applied (docs/HANDOVER.md §8) — so the most scrutinised code in the
# repository was the least checked. `ci.yml` runs lint/typecheck/test, none of which read a
# `.tf` file.
#
# WHY THERE IS NO `terraform plan` HERE: a real plan requires credentials for account
# 290304998906, and the GitHub OIDC role that would supply them is Phase 6 and does not exist
# yet. This workflow therefore deliberately makes **zero AWS API calls** — `init -backend=false`
# skips backend configuration and state entirely, so nothing authenticates and nothing is read
# from the account. That is a feature, not a limitation: a credential-free gate cannot itself
# become a way into the account.
#
# WHEN PHASE 6 LANDS, add a plan job here — `id-token: write`, OIDC into the psignal-dev CI
# role, `plan -lock=false`, and post the output as a PR comment. Do not add credentials to the
# validate job below; keep the credential-free gate as the thing that always runs.

on:
  pull_request:
    paths:
      - 'infra-aws/**'
      - '.github/workflows/terraform-plan.yml'
  push:
    branches: [main]
    paths:
      - 'infra-aws/**'
      - '.github/workflows/terraform-plan.yml'

# Read-only. No `id-token`, because nothing here authenticates to any cloud.
permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # `use_lockfile` on the S3 backend needs >= 1.10; infra-aws/*/versions.tf pins that as
          # required_version. Keep this in step with it.
          terraform_version: '~> 1.10'
          terraform_wrapper: false

      # Formatting first: it is the cheapest check and the one most likely to fail, so failing
      # here keeps the log short and the cause obvious.
      - name: terraform fmt
        run: terraform -chdir=infra-aws fmt -check -recursive -diff

      # Each root module is validated independently. `-backend=false` is what keeps this
      # credential-free: it initialises providers for validation without configuring the S3
      # backend, so no state is read and no AWS call is made.
      #
      # Add new root modules to this list. A module that is not listed is not checked.
      - name: terraform validate (bootstrap)
        run: |
          terraform -chdir=infra-aws/bootstrap init -backend=false -input=false
          terraform -chdir=infra-aws/bootstrap validate

      - name: terraform validate (account)
        run: |
          terraform -chdir=infra-aws/account init -backend=false -input=false
          terraform -chdir=infra-aws/account validate

      - name: terraform validate (stack)
        run: |
          terraform -chdir=infra-aws/stack init -backend=false -input=false
          terraform -chdir=infra-aws/stack validate

  # The account guard is the control the whole sandbox rule rests on. If a script that calls AWS
  # forgets to source it, the rule silently stops being enforced — which is exactly what had
  # happened to 00-discover.sh before this workflow existed. Checking it mechanically means the
  # next such omission fails a PR instead of reaching the account.
  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check every script
        run: |
          for f in infra-aws/scripts/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: shellcheck
        run: shellcheck -S warning infra-aws/scripts/*.sh

      - name: Every AWS-calling script must source the account guard
        run: |
          fail=0
          for f in infra-aws/scripts/*.sh; do
            # _guard.sh defines the guard; it does not source itself.
            [ "$(basename "$f")" = "_guard.sh" ] && continue
            # Only scripts that actually invoke the AWS CLI need it.
            grep -qE '(^|[^[:alnum:]_])aws ' "$f" || continue
            if ! grep -q '_guard.sh' "$f" || ! grep -q 'assert_sandbox_account' "$f"; then
              echo "::error file=$f::calls the AWS CLI but does not source _guard.sh and call assert_sandbox_account"
              echo "  Sandbox rule: account 290304998906 only, and read-only calls elsewhere still count."
              fail=1
            fi
          done
          exit "$fail"
